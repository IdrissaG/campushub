name: build-and-test
on: [pull_request]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campushub_test
          POSTGRES_USER: campushub
          POSTGRES_PASSWORD: campushub
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build et tests backend
        working-directory: campushub
        run: mvn -B clean verify

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./campushub-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

  build-docker-images:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend
        run: docker build -t campushub-backend:ci -f docker/backend/Dockerfile .
      - name: Build image frontend
        run: docker build -t campushub-frontend:ci -f docker/frontend/Dockerfile .

  test-docker-compose:
    needs: build-docker-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d
      - name: Attendre les healthchecks
        run: |
          timeout 60 bash -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done'
      - run: docker compose down