<header class="bg-white border-b border-slate-100 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">

      <div class="flex items-center">
        <span class="font-bold text-slate-800 text-xl tracking-tight">CampusHub</span>
      </div>

      <nav class="hidden md:flex items-center space-x-2">
        <a routerLink="/etudiants"
            routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition-all duration-200">
          <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            Liste des étudiants
          </span>
        </a>

        <a routerLink="/etudiants/nouveau"
            routerLinkActive="bg-indigo-50 text-indigo-600 font-semibold"
            class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-indigo-600 transition-all duration-200">
          <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
            Ajouter un étudiant
          </span>
        </a>

      </nav>

      <div class="hidden md:block w-20"></div>

    </div>
  </div>
</header>

<main class="min-h-[calc(100vh-4rem)] bg-slate-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <router-outlet></router-outlet>
  </div>
</main>
