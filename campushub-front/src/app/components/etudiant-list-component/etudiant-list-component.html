<div class="max-w-7xl mx-auto p-4 md:p-6">
  <!-- En-tête et Contrôles de pagination -->
  <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8">
    <h1 class="text-2xl font-bold text-slate-800">Liste des étudiants</h1>

    <!-- Groupe de pagination stylisé -->
    <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm">
      <button
        (click)="pagePrecedente()"
        class="px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
        Précédent
      </button>

      <span class="text-sm font-semibold text-slate-600 px-2">
        Page {{ pageActuelle() + 1 }}
      </span>

      <button
        (click)="pageSuivante()"
        class="px-4 py-2 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
        Suivant
      </button>
    </div>
  </div>

  <!-- Contenu -->
  @if (loading()) {
    <!-- Skeletons en grille de 2 colonnes -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      @for (i of [1, 2, 3, 4]; track i) {
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm animate-pulse space-y-4">
          <div class="h-6 bg-slate-200 rounded w-1/2"></div>
          <div class="h-4 bg-slate-200 rounded w-full"></div>
          <div class="h-4 bg-slate-200 rounded w-3/4"></div>
        </div>
      }
    </div>
  } @else if (erreur()) {
    <div class="bg-red-50 text-red-600 p-4 rounded-xl border border-red-200 text-center font-medium">
      {{ erreur() }}
    </div>
  } @else if (etudiants().length === 0) {
    <div class="text-center py-12 bg-white rounded-xl border border-slate-200">
      <p class="text-slate-500 font-medium">Aucun étudiant trouvé.</p>
    </div>
  } @else {
    <!-- Grille de 2 colonnes pour des cartes plus grandes -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      @for (etudiant of etudiants(); track etudiant.id) {
        <app-etudiant-card-component
          [etudiant]="etudiant"
          [peutModifier]="authService.estAdmin()"
          (supprimer)="onSupprimer($event)" />
      }
    </div>
  }
</div>
