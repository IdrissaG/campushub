<div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between space-y-4 hover:shadow-md transition-shadow">
  <div>
    <div class="font-semibold text-slate-800 text-base mb-2">
      {{ etudiant().prenom }} {{ etudiant().nom }}
    </div>
    <div class="text-sm text-slate-600 space-y-1.5">
      <div><span class="font-medium text-slate-700">Âge :</span> {{ etudiant().age }} ans</div>
      <div><span class="font-medium text-slate-700">Filière :</span> {{ etudiant().filiere }}</div>
      <div><span class="font-medium text-slate-700">Email :</span> {{ etudiant().email }}</div>
    </div>
  </div>

  <div class="pt-3 border-t border-slate-100 flex justify-end gap-2">
    <a [routerLink]="['/etudiants', etudiant().id]"
       class="px-3 py-1.5 text-sm font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg transition-colors border border-indigo-200">
      Détails
    </a>

    @if (peutModifier()) {
      <button (click)="supprimer.emit(etudiant().id)"
              class="px-3 py-1.5 text-sm font-medium text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors border border-red-200 cursor-pointer">
        Supprimer
      </button>
      <a [routerLink]="['/etudiants', etudiant().id, 'modifier']"
          class="px-3 py-1.5 text-sm font-medium text-slate-600 bg-slate-50 hover:bg-slate-100 rounded-lg transition-colors border border-slate-200">
        Modifier
      </a>
    }
  </div>
</div>
