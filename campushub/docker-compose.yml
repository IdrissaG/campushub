
  version: '3.8'

  services:
    postgres:
      image: postgres:16
      container_name: campushub-postgres
      restart: always
      environment:
        POSTGRES_DB: campushub
        POSTGRES_USER: campushub
        POSTGRES_PASSWORD: campushub
      ports:
        - "5433:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data:
